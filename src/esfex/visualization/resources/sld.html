<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESFEX Single-Line Diagram</title>

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #FFFFFF; }
    #sld-container { width: 100%; height: 100%; position: relative; }
    #sld-container svg { width: 100%; height: 100%; background: #FFFFFF; }

    /* Empty state */
    #empty-message {
        display: none;
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        font-family: 'Segoe UI', Roboto, sans-serif;
        font-size: 15px;
        color: #95A5A6;
        text-align: center;
        pointer-events: none;
    }

    /* Loading spinner */
    #sld-loading {
        display: none;
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        pointer-events: none;
        z-index: 500;
    }
    #sld-loading .spinner {
        width: 32px; height: 32px;
        border: 3px solid #E2E6EA;
        border-top-color: #4A5568;
        border-radius: 50%;
        animation: sld-spin 0.7s linear infinite;
        margin: 0 auto 8px;
    }
    #sld-loading .spinner-text {
        font-family: 'Segoe UI', Roboto, sans-serif;
        font-size: 12px;
        color: #95A5A6;
    }
    @keyframes sld-spin {
        to { transform: rotate(360deg); }
    }

    /* Tooltip */
    #sld-tooltip {
        display: none;
        position: fixed;
        z-index: 1000;
        background: rgba(44, 62, 80, 0.92);
        color: #ECF0F1;
        padding: 6px 10px;
        border-radius: 4px;
        font: 12px 'Segoe UI', Roboto, sans-serif;
        pointer-events: none;
        max-width: 260px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }
    #sld-tooltip .tt-label { font-weight: 600; }
    #sld-tooltip .tt-sub { font-size: 11px; opacity: 0.85; margin-top: 2px; }

    /* Level of detail: sld_controller.js sets lod-far / lod-mid on the svg
       from the zoom scale. Far: frames, bars and lines only, at a constant
       on-screen width. Mid: plus equipment symbols. Text appears only when
       it is large enough to read; until then the substation names are
       drawn at a fixed size in .sld-names. */
    svg.lod-far .sld-root text, svg.lod-mid .sld-root text,
    svg.lod-far .sld-root .lod-label, svg.lod-mid .sld-root .lod-label { display: none; }
    svg.lod-far .layer-stubs, svg.lod-far .layer-equip,
    svg.lod-far .layer-ops, svg.lod-mid .layer-ops > :not(polygon) { display: none; }
    svg.lod-far .layer-edges circle, svg.lod-far .bus-bar circle,
    svg.lod-far .bus-bar-border { display: none; }
    svg.lod-far .edge-path { vector-effect: non-scaling-stroke; stroke-width: 1px; }
    svg.lod-far .bus-bar-line { vector-effect: non-scaling-stroke; stroke-width: 2.5px; }
    svg.lod-far .node-group-bg {
        vector-effect: non-scaling-stroke; stroke-width: 1px; stroke-dasharray: none;
        fill: #8A96A3; fill-opacity: 0.08;
    }

    /* Substation drill-down: breadcrumb back to the whole system, and the
       far-substation names at the end of the line stubs. */
    #sld-breadcrumb {
        display: none;
        position: absolute; top: 10px; left: 10px; z-index: 400;
        align-items: center; gap: 6px; max-width: calc(100% - 20px);
        padding: 5px 10px; border-radius: 5px;
        background: rgba(255, 255, 255, 0.92); border: 1px solid #D5DBE1;
        font: 600 12px 'Segoe UI', Roboto, sans-serif; color: #2C3E50;
    }
    #sld-breadcrumb button {
        border: 0; background: none; padding: 0; cursor: pointer;
        font: inherit; color: #2E86DE;
    }
    #sld-breadcrumb button:hover { text-decoration: underline; }
    #sld-breadcrumb .sep { color: #95A5A6; }
    #sld-bc-site { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .stub-link { cursor: pointer; }
    .stub-link:hover { fill: #2E86DE; text-decoration: underline; }
</style>
</head>
<body>
<div id="sld-container"></div>
<div id="sld-breadcrumb"><button id="sld-bc-system" title="Back to the whole system (Esc)">System</button><span class="sep">&rsaquo;</span><span id="sld-bc-site"></span></div>
<div id="empty-message">No elements to display.<br>Add nodes and equipment in the Geographic View.</div>
<div id="sld-loading"><div class="spinner"></div><div class="spinner-text">Laying out diagram...</div></div>
<div id="sld-tooltip"><span class="tt-label"></span><div class="tt-sub"></div></div>

<!-- D3.js (vendored) -->
<script src="d3.v7.min.js"></script>
<!-- ELK.js (vendored, bundled/synchronous) -->
<script src="elk.bundled.js"></script>
<!-- Qt WebChannel -->
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<!-- SLD Controller -->
<script src="sld_controller.js"></script>
</body>
</html>
