# REUSE specification (https://reuse.software) — declares copyright and
# licensing for the whole tree without per-file SPDX headers, so the project
# is REUSE-compliant. The license texts live in LICENSES/.
#
# Everything is the ESFEX authors' work under Apache-2.0 (first table), except
# the files listed after it: third-party JavaScript libraries bundled with
# Studio, and data files derived from third-party datasets. Those tables use
# precedence = "override", so they replace the first one for their files.
# DATA_SOURCES.md gives the attributions and citations the data terms ask for.
version = 1

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Manuel Soto Calvo and Han Soo Lee"
SPDX-License-Identifier = "Apache-2.0"

# ── Demand density model: data grids derived from third-party datasets ──────
# t_mean, t_range: NEX-GDDP-CMIP6 (CC0-1.0); pop_2020: WorldPop 2020 1 km
# counts (CC-BY-4.0); land_km2: Natural Earth 10m admin-0 (public domain);
# hh_elec_share, bld_share_elec: UN Energy Balances via UNdata, Statistics
# Canada table 25-10-0029-01 (Open Licence), EIA SEDS (US-Government public
# domain). Aggregation to the 0.25 degree grid is the ESFEX authors' work.
[[annotations]]
path = "src/esfex/assets/models/demand_density_v2.grids.npz"
precedence = "override"
SPDX-FileCopyrightText = [
    "2026 Manuel Soto Calvo and Han Soo Lee",
    "NASA Earth Exchange, NEX-GDDP-CMIP6 (Thrasher et al. 2022), and the CMIP6 modelling groups",
    "2018 WorldPop, University of Southampton, and CIESIN, Columbia University",
    "Natural Earth",
    "United Nations Statistics Division (UNdata)",
    "Statistics Canada",
    "U.S. Energy Information Administration",
]
SPDX-License-Identifier = "Apache-2.0 AND CC0-1.0 AND CC-BY-4.0 AND LicenseRef-NaturalEarth-PublicDomain AND LicenseRef-UNdata AND LicenseRef-StatCan-Open-Licence AND LicenseRef-US-Government-Public-Domain"

# hh_elec_share, bld_share_elec by country (same energy statistics as above).
[[annotations]]
path = "src/esfex/assets/models/demand_density_v2.countries.csv"
precedence = "override"
SPDX-FileCopyrightText = [
    "2026 Manuel Soto Calvo and Han Soo Lee",
    "United Nations Statistics Division (UNdata)",
    "Statistics Canada",
    "U.S. Energy Information Administration",
]
SPDX-License-Identifier = "Apache-2.0 AND LicenseRef-UNdata AND LicenseRef-StatCan-Open-Licence AND LicenseRef-US-Government-Public-Domain"

